# .github/workflows/ask-for-versions.yml
#
# Asks the reporter for their exact macOS and OpenCore Legacy Patcher versions
# when an issue doesn't contain them (or only says "latest", "new", "N/A", ...).
# Security reports and suggestions / change requests (also icon or artwork
# contributions) are skipped. The bot comment and label are removed
# automatically once the versions are added (by editing the issue or replying).

name: Ask for missing version info

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  issues: write

concurrency:
  group: version-check-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.user.type != 'Bot' &&
      (github.event_name != 'issue_comment' ||
       github.event.comment.user.login == github.event.issue.user.login)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- version-check-bot -->';
            const LABEL = 'needs-version-info';
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const issue_number = issue.number;
            const title = issue.title || '';
            const body = issue.body || '';
            const labels = (issue.labels || []).map(l => (typeof l === 'string' ? l : l.name).toLowerCase());

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user.type === 'Bot' && (c.body || '').includes(MARKER));
            const issueText = `${title}\n${body}`;

            async function cleanUp(reason) {
              if (existing) await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              if (labels.includes(LABEL)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: LABEL }).catch(() => {});
              }
              core.info(reason);
            }

            // ---- 1. Skip security reports and non-bug issues ----------------
            const SKIP_LABELS = ['security', 'vulnerability', 'enhancement', 'feature request', 'question', 'documentation'];
            if (labels.some(l => SKIP_LABELS.includes(l))) return cleanUp('Skipped: issue has a skip label');
            const SECURITY_RE = /\b(security|vulnerab\w*|cve-\d{4}-\d+|ghsa-[\w-]+|exploit\w*|rce|remote code execution|code injection|command injection|privilege escalation)\b/i;
            if (SECURITY_RE.test(issueText)) return cleanUp('Skipped: looks like a security report');

            // ---- 2. Version patterns ----------------------------------------
            // macOS: 10.15.7, 13.6, 26.6.1 ... or a build number like 25G76 / 25G5065a
            const MACOS_RE = /(?<![\d.])(?:10\.\d{1,2}|1[1-5]\.\d{1,2}|2[6-9]\.\d{1,2})(?:\.\d{1,2})?(?![\d.])|\b\d{2}[A-Z]\d{2,5}[a-z]?\b/;
            // Patcher: 4.0.0.18009, 2.4.1 ... (macOS majors are never single-digit)
            const PATCHER_RE = /(?<![\d.])[0-4]\.\d+\.\d+(?:\.\d+){0,2}(?![\d.])/;
            // Built from source: a commit hash is fine too (only accepted inside the patcher field)
            const COMMIT_RE = /\b[0-9a-f]{7,40}\b/i;
            // Answers that don't count as a version
            const VAGUE_RE = /^(n\/?a|none|no response|unknown|idk|i don'?t know|not sure|\?+|-+|latest|newest|new|current|recent|the (latest|newest)( one| version)?|up to date|beta|nightly|main|master|development)\.?$/i;

            // Issue forms render fields as "### Heading\n\nvalue"
            function section(headingRe) {
              for (const part of body.split(/^###\s+/m).slice(1)) {
                const nl = part.indexOf('\n');
                if (nl === -1) continue;
                if (headingRe.test(part.slice(0, nl))) return part.slice(nl + 1).trim();
              }
              return null;
            }

            // Suggestions, change requests and contributions (icons, artwork, ...)
            // don't need a Mac model or versions. Everything else, including
            // issues opened without the form, is treated as a problem report.
            const usedForm = /^###\s+(mac model|mac-modell|issue type|typ fehler)/im.test(body);
            const SUGGEST_RE = /\b(suggest\w*|feature request|request(ing)? (a |an |the )?(feature|change|option)|would be (nice|great|cool|awesome)|(could|can) you (please )?add|please add|propos(e|al|ing)|vorschlag\w*|vorschlagen|wäre (schön|toll|cool|super))\b|bitte hinzufügen/i;
            const SUGGEST_TITLE_RE = /\b(icons?|logos?|artwork|wallpapers?|themes?|design|mockup|features?|ideas?|idee|improvements?|verbesserung\w*|changes?|enhancements?|translations?)\b|änderung|übersetzung/i;
            const PROBLEM_RE = /\b(bug|panic\w*|crash\w*|boot\w*|freez\w*|froze|hang(s|ing)?|hängt|stuck|error\w*|fehler\w*|fail\w*|broken|kaputt|missing|fehlt|not (working|showing|loading)|(doesn'?t|does not|won'?t|will not|can'?t|cannot) (work|boot|start|install|open|load|show)|black screen|kext|kernel)\b/i;
            // Titles like "Add ...", "Change ...", "[Feature] ..." are requests even if they mention booting etc.
            const REQUEST_TITLE_RE = /^\s*\[(feature|suggestion|request|idea|vorschlag)\]|^\s*(add|change|make|allow|improve|implement|replace|rename|support for|option to|füge|ergänze|ändere)\b/i;
            const issueType = section(/issue type|typ fehler/i);
            const isSuggestion = usedForm
              ? !!issueType && /suggestion|empfehlung|feature/i.test(issueType)
              : SUGGEST_RE.test(issueText) || REQUEST_TITLE_RE.test(title) || (SUGGEST_TITLE_RE.test(title) && !PROBLEM_RE.test(issueText));
            if (isSuggestion) return cleanUp('Skipped: suggestion / change request');

            // Also count replies from the issue author
            const authorText = comments
              .filter(c => c.user.login === issue.user.login)
              .map(c => c.body || '')
              .join('\n');

            function hasVersion(headingRe, valueRe, extraRe) {
              const s = section(headingRe);
              let found;
              if (s !== null) {
                const v = s.replace(/[`*_>]/g, '').trim();
                found = !!v && !VAGUE_RE.test(v) && (valueRe.test(v) || (extraRe ? extraRe.test(v) : false));
              } else {
                found = valueRe.test(title + '\n' + body);
              }
              return found || valueRe.test(authorText);
            }

            const hasMacOS = hasVersion(/macos|os version/i, MACOS_RE);
            const hasPatcher = hasVersion(/patcher|oclp|opencore legacy|app version/i, PATCHER_RE, COMMIT_RE);

            const missing = [];
            if (!hasMacOS) {
              missing.push('**macOS version**, ideally with the build number (e.g. `26.6.1 (25G76)`). You can find it under  → About This Mac, or by running `sw_vers` in Terminal. <img width="431" height="641" alt="Image" src="https://github.com/user-attachments/assets/e87b151b-aafa-4307-be99-fa9e1203e6b6" />');
            }
            if (!hasPatcher) {
              missing.push('**OpenCore Legacy Patcher version** (e.g. `4.0.0.19004.5`), shown in the app\'s main window. If you built from source, the commit hash works too. <img width="812" height="677" alt="Image" src="https://github.com/user-attachments/assets/9fa812d4-650b-4cf7-9f44-6a75c63b7c65" /> ');
            }

            // ---- 3. All good: clean up --------------------------------------
            if (missing.length === 0) return cleanUp('All versions present');

            // ---- 4. Ask (or update the existing request) --------------------
            const text = [
              MARKER,
              `Hi @${issue.user.login}, thanks for the report! To look into this we need to know exactly which versions you're running. Please edit your issue or reply below with:`,
              '',
              ...missing.map(m => `- ${m}`),
              '',
              '"Latest" or "new" isn\'t enough, since new builds come out often. This comment will go away once the versions are added.',
            ].join('\n');

            if (existing) {
              if (existing.body !== text) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: text });
              }
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: text });
            }
            if (!labels.includes(LABEL)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [LABEL] });
            }
