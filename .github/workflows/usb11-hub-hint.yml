name: USB 1.1 hub hint

# Replies once per issue when someone on a USB 1.1 Mac (pre-2012) reports
# that their keyboard / mouse / trackpad isn't recognized.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  issues: write

concurrency:
  group: usb11-hub-hint-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  hint:
    # Skip pull request comments and bot accounts
    if: >-
      !github.event.issue.pull_request &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check report and reply
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- usb11-hub-hint -->';
            const LABEL = 'usb-1.1';

            const issue = context.payload.issue;
            const text = [
              issue.title || '',
              issue.body || '',
              context.payload.comment?.body || '',
            ].join('\n');

            // 1) Is this about input devices not working?
            const device = /\b(mouse|mice|keyboard|trackpad|touchpad|input devices?)\b/i;
            const problem = /\b(not|doesn'?t|don'?t|isn'?t|aren'?t|won'?t|can'?t|cannot|no longer|stopped|dead|unresponsive|undetected)\b.{0,40}\b(work|working|recogni[sz]ed?|detected?|respond|responding|function|functioning|move|moving|typ(e|ing))\b|\b(unresponsive|not recogni[sz]ed|not detected|stopped working|no input)\b/i;
            if (!device.test(text) || !problem.test(text)) {
              core.info('Not an input-device complaint, skipping.');
              return;
            }

            // 2) Is it a USB 1.1 Mac? (pre-2012 models with UHCI/OHCI controllers)
            const usb11Model = new RegExp(
              '\\b(' +
                'MacBook[1-7]|' +
                'MacBookAir[1-4]|' +
                'MacBookPro[1-8]|' +
                'iMac([4-9]|1[0-2])|' +
                'Macmini[1-5]|' +
                'MacPro[1-5]|' +
                'Xserve[1-3]' +
              '),\\d\\b', 'i');
            const usb11Mention = /\b(usb\s*1\.1|ohci|uhci)\b/i;

            if (!usb11Model.test(text) && !usb11Mention.test(text)) {
              core.info('No USB 1.1 Mac detected, skipping.');
              return;
            }

            // 3) Only reply once per issue
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });
            if (comments.some(c => c.body?.includes(MARKER))) {
              core.info('Hint already posted, skipping.');
              return;
            }

            const body = [
              MARKER,
              `Hi @${context.payload.sender.login}! It looks like you're on a Mac with **USB 1.1** controllers.`,
              '',
              'Since macOS Ventura, Apple no longer ships the USB 1.1 (UHCI/OHCI) drivers. Until the root patches are installed, keyboards and mice plugged **directly** into the Mac are not recognized. This happens on the installer, on first boot and after every macOS update that removes the root patches.',
              '',
              '**Workaround:** plug your keyboard and mouse into a **USB hub** (USB 2.0 or newer) and connect the hub to the Mac. The hub talks to the Mac over USB 2.0, which still works without patches.',
              '',
              'Once you can control the Mac again, open the patcher and run **Post-Install Root Patch** to restore USB 1.1 support. After a reboot, your devices should work without the hub.',
              '',
              '> Note: on MacBooks the built-in keyboard/trackpad hang off the internal USB 1.1 bus too, so the hub only helps with external devices until you root patch.',
              '',
              'If it still doesn\'t work with a hub, please reply with your exact model identifier and patcher logs.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });

            // Label is optional — ignore errors if it doesn't exist / can't be created
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [LABEL],
              });
            } catch (e) {
              core.warning(`Could not add label: ${e.message}`);
            }
