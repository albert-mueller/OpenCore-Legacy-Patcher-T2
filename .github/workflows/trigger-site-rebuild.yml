name: Trigger website rebuild

# The website (albert-mueller/albert-mueller.github.io) mirrors this repo's
# open issues, discussions and announcements. Without this workflow it only
# picked up changes on its hourly schedule (which GitHub often delays or
# skips), so new issues and comments didn't show up on the site.
#
# Needs the repository secret SITE_DISPATCH_TOKEN: a fine-grained personal
# access token with access to ONLY albert-mueller/albert-mueller.github.io
# and the permission "Contents: Read and write" (required for
# repository_dispatch). Nothing from the issue/comment is used here; the
# website fetches everything itself.

on:
  issues:
    types: [opened, edited, deleted, closed, reopened, transferred, pinned, unpinned, labeled, unlabeled, locked, unlocked]
  issue_comment:
    types: [created, edited, deleted]
  discussion:
    types: [created, edited, deleted, transferred, pinned, unpinned, category_changed, answered, unanswered, labeled, unlabeled, locked, unlocked]
  discussion_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions: {}

# Bursts of events (e.g. several bot comments at once) collapse into one
# trigger; the website's own "pages" concurrency queues the build.
concurrency:
  group: trigger-site-rebuild
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.repository_owner == 'albert-mueller'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for related events to settle
        run: sleep 20

      - name: Send repository_dispatch to the website
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "::warning::Secret SITE_DISPATCH_TOKEN is not set, the website will only update on its hourly schedule."
            exit 0
          fi
          status=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/albert-mueller/albert-mueller.github.io/dispatches \
            -d "{\"event_type\":\"announcements-updated\",\"client_payload\":{\"source_event\":\"$EVENT_NAME\"}}")
          if [ "$status" != "204" ]; then
            echo "::error::repository_dispatch failed with HTTP $status"
            cat response.txt
            exit 1
          fi
          echo "Website rebuild triggered ($EVENT_NAME)."
