name: Lint, Test & Auto-Fix

on:
  push:
    branches: ['**', '!autofix/**']   # don't loop on our own fix branches
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  # Vendored / generated content that must never be rewritten
  RUFF_EXCLUDE: payloads,NEW_EFI_*,Releases

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install tools
        run: |
          pip install --quiet ruff pyyaml pytest
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck zsh

      # 1) Deterministic fixes (before any AI) - never touches vendored files
      - name: Auto-fix (deterministic)
        shell: bash
        run: |
          EXCL=(':!payloads/**' ':!NEW_EFI_*/**' ':!Releases/**')

          # Whitespace, inside docstrings too (hence --unsafe-fixes, limited to W291/W293)
          ruff check . --select W291,W293 --fix --unsafe-fixes --exit-zero --extend-exclude "$RUFF_EXCLUDE"
          # Syntax-level issues with a mechanical fix:
          #   W605 invalid escape sequence (SyntaxWarning now, SyntaxError in future Python)
          #   F632 `is` / `is not` against a literal (SyntaxWarning)
          ruff check . --select W605,F632 --fix --exit-zero --extend-exclude "$RUFF_EXCLUDE"
          # Undefined names that are clearly a missing stdlib import (sys.exit without import sys, ...)
          python3 .github/scripts/fix_missing_imports.py "$RUFF_EXCLUDE"

          # Shell: trailing whitespace + shellcheck's own error-level autofixes (sh/bash only)
          git ls-files -z -- '*.sh' '*.command' '*.yml' '*.yaml' "${EXCL[@]}" \
            | xargs -0 -r sed -i 's/[[:space:]]*$//'
          while IFS= read -r -d '' f; do
            case "$(head -n1 "$f")" in *python*|*zsh*) continue ;; esac
            patch=$(shellcheck -S error -f diff "$f" 2>/dev/null) || true
            if [ -n "$patch" ]; then
              if printf '%s\n' "$patch" | git apply -; then echo "shellcheck fixed: $f"
              else echo "::warning::could not apply shellcheck fix to $f"; fi
            fi
          done < <(git ls-files -z -- '*.sh' '*.command' "${EXCL[@]}")

      # 2) Syntax checks + tests
      - name: Syntax checks & tests
        id: checks
        continue-on-error: true
        run: bash .github/scripts/syntax_check.sh "$RUNNER_TEMP/failures.jsonl"

      # 3) Let Claude repair syntax errors (only on pushes, where secrets exist)
      - name: AI syntax repair
        id: ai
        if: steps.checks.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 .github/scripts/ai_syntax_fix.py "$RUNNER_TEMP/failures.jsonl" "$RUNNER_TEMP/ai_summary.md"

      - name: Re-check after repair
        id: recheck
        if: steps.ai.outcome == 'success'
        continue-on-error: true
        run: bash .github/scripts/syntax_check.sh

      - name: Collect result
        id: final
        if: always()
        shell: bash
        run: |
          r="${{ steps.recheck.outcome }}"
          if [ -z "$r" ] || [ "$r" = skipped ]; then r="${{ steps.checks.outcome }}"; fi
          echo "result=$r" >> "$GITHUB_OUTPUT"
          {
            echo 'summary<<EOF_SUMMARY'
            cat "$RUNNER_TEMP/ai_summary.md" 2>/dev/null || true
            echo 'EOF_SUMMARY'
          } >> "$GITHUB_OUTPUT"

      # 4) If anything changed, push a branch and open a PR
      - name: Open PR with fixes
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: autofix/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true
          commit-message: 'chore: automatic syntax & lint fixes'
          title: 'Auto-fix: syntax & lint (${{ github.ref_name }})'
          body: |
            Automatic fixes from run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            ${{ steps.final.outputs.summary }}

            Checks after fixing: **${{ steps.final.outputs.result }}**

            > @albert-mueller, @gandolf243 Syntax repairs are AI-generated. Please review the diff before merging.

      # 5) Keep the run red if something couldn't be fixed
      - name: Fail if problems remain
        if: steps.final.outputs.result == 'failure'
        run: |
          echo "::error::Some checks still fail after auto-fix - see the log above."
          exit 1
