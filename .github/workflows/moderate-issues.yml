name: Moderate issues

on:
  issues:
    types: [opened, edited]
  # Malware "fixes" usually arrive as comments on existing issues,
  # and a harmless comment can be edited into one later
  issue_comment:
    types: [created, edited]

permissions:
  contents: write   # commit the tracking file
  issues: write

# Serialize runs so commits to the tracking file never collide
concurrency:
  group: moderation-log
  cancel-in-progress: false

jobs:
  moderate:
    # Never moderate yourself, collaborators or bots (e.g. the other issue bots)
    if: >-
      (github.event_name == 'issues' &&
       !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.type != 'Bot' &&
       !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check issue/comment, delete, block
        env:
          GH_TOKEN: ${{ secrets.MODERATION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPO: ${{ github.repository }}
        run: python .github/scripts/moderate_issue.py

      - name: Commit tracking file
        run: |
          if [ -n "$(git status --porcelain moderation/)" ]; then
            git config user.name "moderation-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add moderation/
            git commit -m "Moderation: log removed issue/comment [skip ci]"
            git pull --rebase
            git push
          fi
