name: License Guard

# Every run audits the WHOLE fork against Dortania's upstream (not just the latest diff),
# so pre-existing violations are found too.
on:
  # pull_request_target so it can comment on PRs from forks too.
  # SAFE: only base-branch code is checked out and executed; the PR is only diffed.
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: license-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_HOLDER: Dortania
  UPSTREAM_REPO: dortania/OpenCore-Legacy-Patcher

jobs:
  license-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (trusted base code)
        uses: actions/checkout@v4
        with:
          # Base branch tip, not pull_request.base.sha: that SHA is frozen at the
          # PR's last update, so allow-list entries added to main later were
          # ignored. Still trusted code - only the base branch is checked out.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.ref || github.sha }}
          fetch-depth: 0

      - name: Determine audit range (upstream vs. fork)
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH=$(gh api "repos/$UPSTREAM_REPO" --jq .default_branch)
          git fetch --no-tags "https://github.com/$UPSTREAM_REPO.git" "+refs/heads/$BRANCH:refs/remotes/upstream/$BRANCH"
          UP="upstream/$BRANCH"
          echo "up=$UP" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "pull_request_target" ]; then
            git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
            HEAD_REF="origin/pr-head"
          else
            HEAD_REF="$AFTER"
          fi
          # Compare against the fork point so Dortania's newer, un-merged changes aren't
          # mistaken for your deletions. Fall back to a plain tree diff if histories are unrelated.
          if git merge-base "$UP" "$HEAD_REF" >/dev/null 2>&1; then
            echo "range=${UP}...${HEAD_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No common history with $UPSTREAM_REPO, using a plain tree diff"
            echo "range=${UP}..${HEAD_REF}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python (for the artwork and image text checks)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check "pillow==11.3.0"

      # tesseract reads the text in screenshots/banners, so Dortania's app name
      # ("OpenCore Legacy Patcher") shown inside an image is found too.
      - name: Install tesseract (OCR for the image text check)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version | head -1

      # OCR results are cached per image blob, so only new or changed images are read again.
      - name: Restore OCR cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/license-guard-art-cache.json
          key: license-guard-art-${{ hashFiles('.github/scripts/license_guard.py') }}-${{ github.run_id }}
          restore-keys: |
            license-guard-art-${{ hashFiles('.github/scripts/license_guard.py') }}-

      - name: Scan fork against upstream
        id: scan
        env:
          RANGE: ${{ steps.range.outputs.range }}
          VIOLATIONS_LIST: head-violations.txt
          # Shared between both scans, so unchanged images are only read once.
          ART_CACHE: ${{ runner.temp }}/license-guard-art-cache.json
        run: python3 .github/scripts/license_guard.py "$RANGE"

      # PRs: also scan the base branch itself, so violations that are already in main
      # (and show up in every PR) are never blamed on the PR.
      - name: Scan base branch (PRs only)
        id: base_scan
        if: github.event_name == 'pull_request_target' && steps.scan.outcome == 'success'
        env:
          UP: ${{ steps.range.outputs.up }}
          REPORT_PATH: base-report.md
          VIOLATIONS_LIST: base-violations.txt
          # Shared between both scans, so unchanged images are only read once.
          ART_CACHE: ${{ runner.temp }}/license-guard-art-cache.json
        run: |
          set -euo pipefail
          if git merge-base "$UP" HEAD >/dev/null 2>&1; then R="${UP}...HEAD"; else R="${UP}..HEAD"; fi
          # Separate report file and no job summary: this run is only used for comparison.
          GITHUB_STEP_SUMMARY= python3 .github/scripts/license_guard.py "$R" > /dev/null

      - name: Find violations this PR adds
        id: new
        if: steps.base_scan.outcome == 'success'
        run: |
          export LC_ALL=C
          sort -u base-violations.txt > b.txt
          sort -u head-violations.txt > h.txt
          comm -13 b.txt h.txt > new-violations.txt
          echo "count=$(wc -l < new-violations.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "Violations added by this PR:"; cat new-violations.txt

      - name: Comment on PR / update issue
        if: steps.scan.outcome == 'success'
        uses: actions/github-script@v7
        env:
          VIOLATIONS: ${{ steps.scan.outputs.violations }}
          WARNINGS: ${{ steps.scan.outputs.warnings }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- license-guard -->';
            const forkMarker = '<!-- license-guard-fork -->';
            const { owner, repo } = context.repo;
            const violations = Number(process.env.VIOLATIONS || 0);
            const warnings = Number(process.env.WARNINGS || 0);
            let body = fs.readFileSync('license-report.md', 'utf8');
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n…truncated, see the workflow log.';
            body += `\n\n<sub>Full audit against ${process.env.UPSTREAM_REPO} · [Workflow run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})</sub>`;

            // Who to ping for a fork: its owner, plus any extra people (e.g. the PR author).
            // An organisation can't be @-mentioned, so for org-owned forks the person who
            // triggered the run is pinged instead. Bots are never pinged.
            const mentionsFor = (forkRepo, ...people) => {
              const names = new Set(people);
              const o = forkRepo?.owner;
              if (o?.login) names.add(o.type === 'Organization' ? context.actor : o.login);
              return [...names].filter(n => n && !n.endsWith('[bot]')).map(n => `@${n}`).join(' ');
            };
            // Fork note right under the report heading.
            const withForkNote = (text, forkRepo, who, parent) => {
              const org = forkRepo.owner?.type === 'Organization' ? ` (organisation **${forkRepo.owner.login}**)` : '';
              const from = parent ? `, forked from \`${parent}\`` : '';
              const note = `${forkMarker}\n> 🍴 **Fork:** [\`${forkRepo.full_name}\`](${forkRepo.html_url})${org}${from}` +
                (who ? `\n> ${who} – please fix the license violation(s) below.` : '');
              return text.replace('## 🛡️ License Guard\n', `## 🛡️ License Guard\n\n${note}\n`);
            };

            // PR: one sticky comment, updated on every push (and flipped to ✅ once fixed)
            if (context.eventName === 'pull_request_target') {
              const pr = context.payload.pull_request;
              const issue_number = pr.number;
              const head = pr.head.repo;   // null if the fork was deleted
              const fromFork = !!head && head.full_name !== `${owner}/${repo}`;
              const who = fromFork ? mentionsFor(head, pr.user?.login) : '';
              if (fromFork && violations > 0) body = withForkNote(body, head, who);
              const comments = await github.paginate(github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 });
              const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                // Editing a comment doesn't notify anyone, so ping the fork once when an
                // existing ✅ / warnings-only comment turns into one with violations.
                if (fromFork && violations > 0 && who && !existing.body.includes(forkMarker)) {
                  await github.rest.issues.createComment({ owner, repo, issue_number, body:
                    `${who} License Guard found ${violations} license violation(s) in this pull request ` +
                    `from \`${head.full_name}\` – see the License Guard comment above.` });
                }
              } else if (violations + warnings > 0) {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
              return;
            }

            // Push / schedule / manual: keep ONE issue up to date, close it when clean.
            // When this runs in a fork of the project, the fork's owner is pinged in the issue.
            const { data: self } = await github.rest.repos.get({ owner, repo });
            let who = '';
            if (self.fork && violations > 0) {
              who = mentionsFor(self);
              body = withForkNote(body, self, who, self.parent?.full_name);
            }
            const label = 'license-guard';
            try {
              const open = await github.paginate(github.rest.issues.listForRepo,
                { owner, repo, state: 'open', labels: label, per_page: 100 });
              const issue = open.find(i => !i.pull_request);
              if (violations === 0) {
                if (issue) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                    body: '✅ License Guard: no violations left in the latest full audit, closing.' });
                  await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
                }
                return;
              }
              const title = `License Guard: ${violations} possible license violation(s)`;
              if (issue) {
                if (issue.body !== body || issue.title !== title) {
                  await github.rest.issues.update({ owner, repo, issue_number: issue.number, title, body });
                }
              } else {
                try {
                  await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205',
                    description: 'Possible upstream license violation' });
                } catch (e) { if (e.status !== 422) throw e; }
                await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
              }
            } catch (e) {
              // Forks have Issues turned off by default (410 Gone): don't crash, point to the summary.
              if (e.status !== 410) throw e;
              core.warning(`Issues are disabled in ${self.full_name}, so no License Guard issue could be filed.` +
                (who ? ` ${who}: see the job summary for the ${violations} violation(s).` : ''));
            }

      # Only PRs from forks, and only for violations the PR itself adds. PRs that fix
      # violations (or come from branches in this repo) are never closed.
      - name: Close fork PR that adds violations
        if: >-
          steps.new.outcome == 'success' && steps.new.outputs.count != '0' &&
          github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const head = pr.head.repo;   // null if the fork was deleted
            // Ping the PR author and the fork's owner (org owners can't be @-mentioned).
            const names = new Set([pr.user?.login]);
            if (head?.owner?.login && head.owner.type !== 'Organization') names.add(head.owner.login);
            const who = [...names].filter(n => n && !n.endsWith('[bot]')).map(n => `@${n}`).join(' ');
            const fork = head ? `from the fork [\`${head.full_name}\`](${head.html_url}) ` : '';
            const list = fs.readFileSync('new-violations.txt', 'utf8').trim().split('\n')
              .filter(Boolean).map(l => `- ${l}`).join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body:
              `🛡️ **License Guard closed this pull request automatically.**${who ? ' ' + who : ''}\n\n` +
              `This pull request ${fork}adds license violations that aren't in \`${pr.base.ref}\`:\n\n${list}\n\n` +
              `Keep every upstream copyright notice and use your own artwork instead of Dortania's or Apple's, ` +
              `then open a new pull request. The License Guard comment above has the details.` });
            await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: 'closed' });

      - name: Fail on violations
        if: steps.scan.outputs.violations != '0'
        run: |
          echo "::error::License Guard found license violation(s) – see the PR comment / issue."
          exit 1
