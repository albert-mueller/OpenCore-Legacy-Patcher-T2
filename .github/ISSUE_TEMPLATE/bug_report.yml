name: Bug report / Fehlermeldung
description: Report a boot, panic, or patching issue with OpenCore Legacy Patcher T2 / Melden Sie ein Start-, Panik- oder Patching-Problem mit OpenCore Legacy Patcher T2
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Please fill in as much detail as you can — panic strings and logs help the most.
        Vielen Dank für Ihre Fehlermeldung. Bitte geben Sie so viele Details wie möglich an – Panikmeldungen und Protokolle sind dabei besonders hilfreich.

  - type: dropdown
    id: mac-model
    attributes:
      label: Mac model / Mac-Modell
      description: Which Mac is affected? / Welches Mac ist betroffen?
      options:
        - "T2 — Mac mini (2020, 128/256GB SSD storage)"
        - "T2 — Mac mini (2018)"
        - "T2 — MacBook Pro 13-inch (2018, 4 Thunderbolt 3 ports)"
        - "T2 — MacBook Pro 13-inch (2019, 4 Thunderbolt 3 ports)"
        - "T2 — MacBook Pro 15-inch (2018-2019)"
        - "T2 — MacBook Pro 13-inch (2020, 2 thunderbolt 3 ports, Intel)"
        - "T2 — MacBook Pro 13-inch (2020, 4 thunderbolt 3 ports)"
        - "T2 — MacBook Pro 16-inch (2019)"
        - "T2 — MacBook Air 2018"
        - "T2 — MacBook Air 2019"
        - "T2 — MacBook Air 2020, Intel"
        - "T2 — iMac Pro (2017)"
        - "T2 — iMac 27-inch Retina 5K (2020)"
        - "T2 — Mac Pro (2019)"
        - "T1 — MacBook Pro 2017"
        - "T1 — MacBook Pro 2016"
        - "non-T chip: 2015 MacBook Pro"
        - "non-T chip: 2014 MacBook Pro"
        - "non-T chip: 2013 MacBook Pro"
        - "non-T chip: 2012 MacBook Pro"
        - "non-T chip: 2011 MacBook Pro"
        - "non-T chip: 2010 MacBook Pro"
        - "non-T chip: 2009 MacBook Pro"
        - "non-T chip: 2008 MacBook Pro"
        - "non-T chip: MacBook Air 2017"
        - "non-T chip: MacBook Air 2015"
        - "non-T chip: MacBook Air 2014"
        - "non-T chip: MacBook Air 2013"
        - "non-T chip: MacBook Air 2012"
        - "non-T chip: MacBook Air 2011"
        - "non-T chip: MacBook Air 2010"
        - "non-T chip: MacBook Air 2009"
        - "non-T chip: MacBook Air 2008"
        - "non-T chip: MacBook Retina 12 inch 2017"
        - "non-T chip: MacBook Retina 12 inch 2016"
        - "non-T chip: MacBook Retina 12 inch 2015"
        - "non-T chip: MacBook 2010"
        - "non-T chip: MacBook 2009"
        - "non-T chip: MacBook 2008"
        - "non-T chip: Mac mini (2014)"
        - "non-T chip: Mac mini (2012)"
        - "non-T chip: Mac mini (2011)"
        - "non-T chip: Mac mini (2010)"
        - "non-T chip: Mac mini (2009)"
        - "non-T chip: iMac 2017"
        - "non-T chip: iMac 2015"
        - "non-T chip: iMac 2014"
        - "non-T chip: iMac 2013"
        - "non-T chip: iMac 2012"
        - "non-T chip: iMac 2011"
        - "non-T chip: iMac 2010"
        - "non-T chip: iMac 2009"
        - "non-T chip: iMac 2008"
        - "non-T chip: Mac Pro (2013)"
        - "non-T chip: Mac Pro 2012"
        - "non-T chip: Mac Pro 2011"
        - "non-T chip: Mac Pro 2010"
        - "non-T chip: Mac Pro 2009"
        - "non-T chip: Mac Pro 2008"
        - "not applicable / nicht anwendbar"
    validations:
      required: true

  - type: input
    id: target-macos
    attributes:
      label: Target macOS version (if it is about malicious forks, typosquatting sites or security vulnerabilities, write - instead) / macOS-Zielversion (falls es um Typpfehler-Webseiten, Typpfehler-Repository oder Sicherheitslücken handelt, schreiben Sie stattdessen ein - )
      placeholder: e.g. macOS 26.6 Tahoe / z.B macOS 26.6 Tahoe
    validations:
      required: true

  - type: input
    id: oclp-version
    attributes:
      label: OpenCore Legacy Patcher T2 version (Please state the version clearly, not state as version new or something. / Bitte die exakte Version nennen, nicht nur etwas oder neu.)
      placeholder: e.g. 4.0.0.16000 or 4.0.0 alpha 16 / z.B 4.0.0.16000 oder 4.0.0 alpha 16
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue type / Typ Fehler
      options:
        - Boot failure / Startfehler
        - Kernel panic
        - OpenCore related issues / Probleme, die mit OpenCore verwandt sind
        - Installer error / Installationsfehler
        - Graphics glitch / Grafikfehler
        - Wi-Fi / Bluetooth
        - Audio
        - Sleep / wake / Ruhezustand / Aufwachen
        - USB
        - Installing root patches fails / Installierung von Root Patches schlägt fehl
        - Application related issues / Anwendungsprobleme
        - Security vulnerability - in the main project, please do not report it here and go to Security and quality and report a vulnerability there / - Sicherheitslücke - in der Hauptprojekt, bitte melden Sie diese nicht hier, sondern im Bereich „Security and quality“.
        - Malicious website delivering malware disguised as OpenCore Legacy Patcher / Bösartige Webseite, die sich tarnt als OpenCore Legacy Patcher T2, um Malware einzuschleusen
        - Malicious, typosquatting site trying to impersonate Dortania or Albert Müller / Bösartiges, Tippfehler-Webseite, die sich als Dortania oder Albert Müller tarnt
        - Typosquatting repository (e.g  ОpenCore-Legacy-Patchеr-T2 with cyrilic o and e or OCLP-T2) / Repository mit Tippfehlern (z.B ОpenCore-Legacy-Patchеr-T2 mit kirillischer o und e)
        - Malicious fork / Bösartiges Fork
        - Other / Andere
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description / Beschreibung
      description: What went wrong? / Was ist los?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to upload the logs of the kernel panic if any (if not, you can skip this step or write -) / Schritte zum Hochladen der Protokolle des Kernel-Panics, falls vorhanden (falls keiner, dann Sie können das überspringen oder einen - schreiben) 
      placeholder: |
        If this is a kernel panic, follow these steps / Falls das einen Kernel Panic ist, folgen Sie bitte die folgenden Schritten:
        Whenever is possible, please upload a slow motion video displaying the boot sequence before and during the kernel panic.
        And here's how to upload logs from OpenCore:
        1. When you face the kernel panic, force shut down your Mac by holding the power button for 10 seconds
        2. Then, wait 10 seconds
        3. Then, click the power button to start the Mac again
        4. Hold Option and choose Macintosh HD (or whatever is called your main drive)
        5. Open the OpenCore Legacy Patcher T2 app
        6. Click on OpenCore
        7. Go to Debugging
        7. Enable Verbose, OpenCore Debugging and Kext Debugging
        8. Build OpenCore as usual
        9. Boot your Mac into OpenCore
        10. Once the kernel panic appears, force shut down your Mac and boot back into the main drive
        11. Open Terminal
        12. Type sudo diskutil mount /dev/disk0s1 and hit Enter
        13. Type your password (you won't see it!) and hit Enter
        14. Now the EFI is mounted, open Finder
        15. Click on EFI
        16. Select all files inside it
        17. Right click -> Compress - it will create a Zip file
        18. Upload it here

        Laden Sie nach Möglichkeit ein Slow-Motion-Video hoch, das den Bootvorgang vor und während der Kernel-Panik zeigt.
        Und so laden Sie Logs von OpenCore hoch:
        1. Wenn ein Kernel-Panic auftritt, erzwingen Sie das Herunterfahren Ihres Macs, indem Sie den Einschaltetaste 10 Sekunden lang gedrückt halten.
        2. Warten Sie anschließend 10 Sekunden.
        3. Klicken Sie dann auf den Einschaltetaste, um den Mac neu zu starten.
        4. Halten Sie die Wahltaste (⌥) gedrückt und wählen Sie „Macintosh HD“ (oder wie auch immer Ihr Hauptlaufwerk heißt).
        5. Öffnen Sie die App „OpenCore Legacy Patcher T2“.
        6. Klicken Sie auf „OpenCrore“.
        7. Gehen Sie nach Debugging
        7. Aktivieren Sie „Verbose“, „OpenCore Debugging“ und „Kext Debugging“.
        8. Bauen Sie OpenCore wie gewohnt.
        9. Starten Sie Ihren Mac mit OpenCore.
        10. Sobald der Kernel-Panic erneut auftritt, erzwingen Sie das Herunterfahren Ihres Macs und starten Sie ihn wieder vom Hauptlaufwerk.
        11. Öffnen Sie das Terminal.
        12. Geben Sie „sudo diskutil mount /dev/disk0s1“ ein und drücken Sie die Eingabetaste.
        13. Geben Sie Ihr Passwort ein (es wird nicht angezeigt!) und drücken Sie die Eingabetaste.
        14. Das EFI-Laufwerk ist nun gemountet. Öffnen Sie den Finder.
        15. Klicken Sie auf EFI.
        16. Wählen Sie alle darin enthaltenen Dateien aus.
        17. Klicken Sie mit der rechten Maustaste und wählen Sie „Komprimieren“. Dadurch wird eine ZIP-Datei erstellt.
        18. Laden Sie die Datei hier hoch.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Panic log (if any) / additional notes (if any) / Panikprotokoll (falls einer) / zusätzliche Notizen (falls einer)
      description: Upload the EFI or a slow motion video displaying the boot sequence. / Laden Sie die EFI-Datei oder ein Slow-Motion-Video hoch, das die Bootsequenz zeigt.
      render: shell
